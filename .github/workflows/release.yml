name: Release

# Builds the installers on every OS. A `v*` tag also publishes them to a draft GitHub
# release. Pull requests that touch packaging build the Linux installers only (Linux first,
# ADR 0002): a cold Windows build adds ~10 minutes and macOS runners can queue for 15.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/linux-deps/**
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `strategy` cannot read `env`, so both lists are inline JSON.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '[{"os":"ubuntu-latest","bundles":"deb,appimage"}]'
            || '[{"os":"ubuntu-latest","bundles":"deb,appimage"},
                 {"os":"macos-latest","bundles":"app,dmg"},
                 {"os":"windows-latest","bundles":"msi,nsis"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@stable

      # Only main saves: other refs cannot read caches of pull requests or tags, and those
      # ~400 MB entries would evict main's within the 10 GB repository limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs `pnpm build` first (beforeBuildCommand), then a release build and the bundles.
      - name: Build installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  publish:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # Artifacts keep their bundle sub-folders (deb/, appimage/, dmg/, msi/, nsis/), so the
        # files are collected recursively.
        run: |
          mapfile -t files < <(find installers -type f)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Runbook $GITHUB_REF_NAME"
