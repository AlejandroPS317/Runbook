name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Tauri on Linux renders through WebKitGTK; macOS and Windows use the system webview.
      # The .deb files are cached: the runner's mirror sometimes trickles the 25 MB WebKitGTK
      # package for many minutes.
      - name: Cache Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # man-db triggers re-index manuals for every installed package and can stall the step,
      # so they are disabled first. Each attempt is bounded so a stalled download is retried
      # instead of eating the whole job.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get $apt_opts update
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get $apt_opts install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            echo "apt install attempt $attempt failed or stalled; retrying"
          done
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: pnpm check

      # Built before Cargo so `tauri::generate_context!` can embed `dist/`.
      - name: Frontend build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
