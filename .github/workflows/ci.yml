name: CI

# Documentation-only changes build nothing, to save Actions minutes.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - assets/**
  pull_request:
    paths-ignore:
      - "**/*.md"
      - docs/**
      - assets/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests check Linux only (Linux first, ADR 0002); main checks all three OSes
        # after every merge. `strategy` cannot read `env`, so both lists are inline JSON.
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '["ubuntu-latest"]'
            || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Tauri on Linux renders through WebKitGTK; macOS and Windows use the system webview.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # A warm package cache installs in about a minute; a stalled mirror fails fast.
        timeout-minutes: 8
        uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Pull requests restore main's cache; only main saves, so per-PR entries (~1 GB each)
      # do not evict it within the 10 GB repository limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: pnpm check

      # Built before Cargo so `tauri::generate_context!` can embed `dist/`.
      - name: Frontend build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
