[package]
name = "runbook"
description = "Runbook desktop app: Tauri shell around the Runbook crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "runbook_app"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
runbook-core = { version = "0.4.0", path = "../crates/runbook-core" }
runbook-git = { version = "0.4.0", path = "../crates/runbook-git" }
runbook-process = { version = "0.4.0", path = "../crates/runbook-process" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
